name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: report.py tests
        run: python3 -m unittest discover -s tests -v

      - name: tag matches SKILL.md version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^  version: "\(.*\)"$/\1/p' SKILL.md)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match SKILL.md version $version" >&2
            exit 1
          fi
